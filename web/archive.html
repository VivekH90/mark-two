<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive · {{SITE_TITLE}}</title>
<script>(function(){try{var s=localStorage.getItem('mark-two-theme-v2'),t=s||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');if(t==='dark')document.documentElement.dataset.theme='dark'}catch(e){}})();</script>
<style>
:root{--bg:#fbfaf6;--fg:#1c1d24;--muted:#5c5f6b;--rule:#dcd8cc;--link:#3a43a8;--teal:#0f766e;--soft:#f1efe7;--blue:#eef0fb;--orange:#fffaf0;--sans:"CMU Sans Serif","Computer Modern Sans","Latin Modern Sans","LM Sans 10","Computer Modern Sans Serif",Helvetica,Arial,sans-serif}
:root[data-theme=dark]{--bg:#12141a;--fg:#e8e6df;--muted:#a4a5ad;--rule:#2e313b;--link:#9aa3ff;--teal:#5fd0c0;--soft:#1b1e26;--blue:#1b1d33;--orange:#241f17;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:1.05rem;line-height:1.75}a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}.wrap{width:min(58rem,calc(100% - 2.4rem));margin:auto}
.top{border-bottom:1px solid var(--rule);background:var(--bg)}.top-wrap{min-height:4.4rem;display:flex;align-items:center;gap:1.6rem}.brand{display:flex;align-items:center;gap:.55rem;margin-right:auto;color:var(--fg);font-weight:700}.brand:hover{text-decoration:none}.brand-mark{width:1.8rem;height:1.8rem;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg)}.nav{display:flex;gap:1.15rem}.nav a{font-size:.88rem;color:var(--muted)}.nav a:hover{color:var(--fg);text-decoration:none}.theme{width:1.9rem;height:1.9rem;border:1px solid var(--rule);border-radius:50%;background:transparent;color:var(--fg);display:grid;place-items:center}.theme svg{width:14px}.theme .moon{display:none}:root[data-theme=dark] .theme .sun{display:none}:root[data-theme=dark] .theme .moon{display:block}
main{padding:4rem 0 5rem}.head{max-width:48rem;margin:0 auto 2.2rem}.kicker{color:var(--teal);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.05;letter-spacing:-.03em;margin:.35rem 0 .6rem}.lead{color:var(--muted);margin:0}.tools{max-width:48rem;margin:0 auto 2rem;display:flex;gap:1rem;align-items:center}.search{flex:1;border:0;border-bottom:1.5px solid var(--fg);background:transparent;color:var(--fg);padding:.55rem 0;outline:0}.search:focus{border-bottom-color:var(--link)}.count{font-size:.78rem;color:var(--muted);white-space:nowrap}
.archive{max-width:48rem;margin:auto}.year{color:var(--teal);font-size:.85rem;margin:2rem 0 .2rem;border-bottom:1.5px solid var(--fg);padding-bottom:.25rem}.year:first-child{margin-top:0}.archive-row{display:grid;grid-template-columns:6rem minmax(12rem,1.4fr) minmax(12rem,1fr) 7rem;gap:1rem;align-items:baseline;padding:.72rem .35rem;border-bottom:1px solid var(--rule)}.archive-row:hover{background:var(--soft)}.archive-row time,.category{color:var(--muted);font-size:.76rem}.archive-row>a{color:var(--fg);font-size:.94rem}.description{color:var(--muted);font-size:.78rem}.is-hidden,.year.is-hidden{display:none}.empty{color:var(--muted)}
@media(max-width:760px){.nav{display:none}.archive-row{grid-template-columns:5rem minmax(0,1fr)}.description,.category{grid-column:2}}@media(max-width:480px){.wrap{width:min(100% - 2rem,58rem)}main{padding-top:3rem}.archive-row{grid-template-columns:1fr}.description,.category{grid-column:auto}}
</style></head><body><header class="top"><div class="wrap top-wrap"><a class="brand" href="{{HOME_URL}}"><span class="brand-mark">∫</span><span>{{AUTHOR}}</span></a><nav class="nav"><a href="{{HOME_URL}}">Home</a><a href="{{ARCHIVE_URL}}">Archive</a><a href="{{ABOUT_URL}}">About</a><a href="{{GITHUB_URL}}" target="_blank" rel="noopener">GitHub</a></nav><button class="theme" type="button" aria-label="Toggle dark mode"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22"/></svg><svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 8.5 8.5 0 0 0 20 14.5z"/></svg></button></div></header><main><div class="wrap"><section class="head"><div class="kicker">Archive</div><h1>All notes</h1><p class="lead">Every article, organized chronologically.</p></section><div class="tools"><input class="search" id="archive-search" type="search" placeholder="Search the archive…" autocomplete="off"><span class="count" id="count"></span></div><section class="archive" id="archive">{{ARCHIVE_ROWS}}</section></div></main>
<script>(function(){var r=document.documentElement,t=document.querySelector('.theme');t.onclick=function(){var d=r.dataset.theme==='dark';if(d)delete r.dataset.theme;else r.dataset.theme='dark';try{localStorage.setItem('mark-two-theme-v2',d?'light':'dark')}catch(e){}};var i=document.getElementById('archive-search'),rows=document.querySelectorAll('.archive-row'),ys=document.querySelectorAll('.year'),c=document.getElementById('count');function f(){var q=i.value.toLowerCase().trim(),n=0;rows.forEach(function(x){var s=(x.dataset.search||x.textContent).toLowerCase(),v=!q||s.includes(q);x.classList.toggle('is-hidden',!v);if(v)n++});ys.forEach(function(y){var x=y.nextElementSibling,h=0;while(x&&x.classList.contains('archive-row')){if(!x.classList.contains('is-hidden'))h=1;x=x.nextElementSibling}y.classList.toggle('is-hidden',!h)});c.textContent=n+' article'+(n===1?'':'s')}i.oninput=f;f()})();</script></body></html>
