<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ARTICLE_TITLE}} | {{DOCUMENT_TITLE}}</title>

    <!-- Computer Modern Sans web font. The family is named "Computer Modern Sans" in the web-font package. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bitmaks/cm-web-fonts@latest/fonts.css">

    <link rel="stylesheet" href="style.css">

    <!-- MathJax 4 for standard TeX delimiters. -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']],
                processEscapes: true,
                tags: 'ams'
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="site-shell">
        <header class="site-header">
            {{BANNER}}
            <nav class="navigation" aria-label="Site navigation">
                {{BUTTONS}}
                <button class="nav-button theme-toggle" type="button" aria-label="Enable dark mode" aria-pressed="false">
                    <span class="theme-icon" aria-hidden="true">☾</span>
                    <span class="theme-label">Dark Mode</span>
                </button>
            </nav>
        </header>

        <div class="page-layout">
            <main class="article">
                <h1 class="article-title">{{ARTICLE_TITLE}}</h1>
                {{ARTICLE}}
            </main>

            <aside class="sidebar" aria-label="Article information">
                <section class="sidebar-card toc-card">
                    <div class="sidebar-heading">
                        <h2>Table of Contents</h2>
                        <button class="sidebar-toggle" type="button" aria-label="Toggle table of contents" aria-expanded="true">☷</button>
                    </div>
                    <nav class="toc" aria-label="Table of contents">
                        <ol>
                            {{TOC}}
                        </ol>
                    </nav>
                </section>

                <section class="sidebar-card related-card">
                    <div class="sidebar-heading">
                        <h2>Related Links</h2>
                        <span class="link-symbol" aria-hidden="true">↗</span>
                    </div>
                    <ul class="related-links">
                        {{RELATED_LINKS}}
                    </ul>
                </section>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
