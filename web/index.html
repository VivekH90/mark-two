<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ARTICLE_TITLE}}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sugina-dev/latin-modern-web@1.0.1/style/latinmodern-sans.css">
    <link rel="stylesheet" href="style.css">

    <!-- MathJax 4 for standard TeX delimiters. -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']],
                processEscapes: true,
                tags: 'ams'
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="site-shell">
        <header class="site-header">
            <div class="hero-author">
                <div class="author-kicker">Author</div>
                <div class="author-name">{{AUTHOR}}</div>
            </div>
            <div class="hero-banner">
                {{BANNER}}
                <form class="site-search" role="search">
                    <label class="sr-only" for="site-search-input">Search</label>
                    <span class="search-icon" aria-hidden="true">⌕</span>
                    <input id="site-search-input" type="search" placeholder="Search" autocomplete="off">
                </form>
                <button class="theme-toggle" type="button" aria-label="Enable dark mode" aria-pressed="false">
                    <span class="theme-icon" aria-hidden="true">☾</span>
                    <span class="theme-label">Dark Mode</span>
                </button>
            </div>
        </header>

        <div class="page-layout">
            <aside class="left-sidebar" aria-label="Site navigation">
                <section class="sidebar-card navigation-card">
                    <div class="sidebar-heading">
                        <h2>Navigation</h2>
                    </div>
                    <nav class="site-navigation">
                        {{BUTTONS}}
                        <span class="nav-button nav-static" style="--button-color: #b85c5c;" aria-hidden="true">Physics</span>
                        <span class="nav-button nav-static" style="--button-color: #8a63b8;" aria-hidden="true">Mathematics</span>
                        <span class="nav-button nav-static" style="--button-color: #5f7fa8;" aria-hidden="true">Computer Science</span>
                        <span class="nav-button nav-static" style="--button-color: #a06f57;" aria-hidden="true">Thoughts</span>
                    </nav>
                </section>
            </aside>

            <main class="article">
                <h1 class="article-title">{{ARTICLE_TITLE}}</h1>
                {{ARTICLE}}
            </main>

            <aside class="right-sidebar" aria-label="Article information">
                <section class="sidebar-card toc-card">
                    <div class="sidebar-heading">
                        <h2>On this page</h2>
                        <button class="sidebar-toggle" type="button" aria-label="Toggle table of contents" aria-expanded="true">☷</button>
                    </div>
                    <nav class="toc" aria-label="Table of contents">
                        <ol>
                            {{TOC}}
                        </ol>
                    </nav>
                </section>

                <section class="sidebar-card related-card">
                    <div class="sidebar-heading">
                        <h2>Related Links</h2>
                        <span class="link-symbol" aria-hidden="true">↗</span>
                    </div>
                    <ul class="related-links">
                        {{RELATED_LINKS}}
                    </ul>
                </section>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
